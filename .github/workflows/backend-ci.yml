name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/company-deploy-egress.sh
          /bin/bash -n deploy/company-verify-egress.sh
          /bin/bash -n deploy/company-export-migration.sh
          /bin/bash -n deploy/company-bootstrap-cn.sh
          /bin/bash -n deploy/company-activate-egress.sh
          /bin/bash -n deploy/company-install-fresh.sh
          /bin/bash -n deploy/company-postgresql16.sh
          /bin/bash -n deploy/company-route-apply.sh
          python3 deploy/tests/company-route-test.py
          python3 deploy/tests/companyctl-test.py
          python3 -m json.tool deploy/company-route.example.json >/dev/null
          python3 -m json.tool deploy/company-subscription.selected.example.json >/dev/null
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check company PowerShell wrapper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/company-update.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Company egress static guard
        run: python3 tools/check_company_egress_guard.py
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend
      - name: Build frontend for embedded website
        working-directory: frontend
        run: pnpm run build
      - name: Upload embedded frontend files
        uses: actions/upload-artifact@v7
        with:
          name: company-frontend-${{ github.sha }}
          path: backend/internal/web/dist/
          if-no-files-found: error
          retention-days: 1

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=30m
          working-directory: backend

  company-binary:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/company/egress-v1' || github.ref == 'refs/heads/company/egress-v1-ubuntu22.04' || startsWith(github.ref, 'refs/heads/company/upgrade-'))
    needs: [shell, test, frontend, golangci-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download verified frontend
        uses: actions/download-artifact@v8
        with:
          name: company-frontend-${{ github.sha }}
          path: backend/internal/web/dist/
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify embedded frontend
        run: test -s backend/internal/web/dist/index.html
      - name: Build embedded-site Linux amd64 binary
        working-directory: backend
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags embed \
            -trimpath -ldflags="-s -w -X main.Version=company-${GITHUB_SHA} -X main.Commit=${GITHUB_SHA} -X main.BuildType=company" \
            -o ../dist/sub2api-linux-amd64 ./cmd/server
          mkdir -p ../dist/company-ops
          install -m 0755 ../deploy/company-deploy-egress.sh ../dist/company-ops/company-deploy-egress
          install -m 0755 ../deploy/company-verify-egress.sh ../dist/company-ops/company-verify-egress
          install -m 0755 ../deploy/company-route.py ../dist/company-ops/company-route
          install -m 0755 ../deploy/company-route-apply.sh ../dist/company-ops/company-route-add
          install -m 0755 ../deploy/companyctl.py ../dist/company-ops/companyctl
          (
            cd ../dist/company-ops
            sha256sum company-deploy-egress company-verify-egress company-route company-route-add companyctl > SHA256SUMS
          )
      - name: Upload verified company website binary
        uses: actions/upload-artifact@v7
        with:
          name: sub2api-linux-amd64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
